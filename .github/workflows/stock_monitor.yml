name: ARQ Stock Monitor PRO

on:
  schedule:
    # Cada 15 minutos (menos rate limit)
    - cron: "*/15 14-20 * * 1-5"
  workflow_dispatch:

jobs:
  monitorear:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install yfinance pandas pytz requests

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py